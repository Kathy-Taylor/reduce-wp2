version: '5.0'


actions:


  #WP2.1
  generate_dataset_wp2_1:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_wp2_1.py --output output/tmp_dataset_wp2_1.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/tmp_dataset_wp2_1.csv.gz


  diabetes_algo_wp2_1:
    run: diabetes-algo:v0.0.6 --output output/dataset_wp2_1.csv.gz
    config:
      df_input: tmp_dataset_wp2_1.csv.gz
      birth_date: dob
      ethnicity_cat: ethnicity_cat
      df_output: dataset_wp2_1.csv.gz
    needs:
      - generate_dataset_wp2_1
    outputs:
      highly_sensitive:
        dataset: output/dataset_wp2_1.csv.gz

  wp2_1_processing:
    run:r:v2 analysis/wp2_1/Data_prep_WP2_1.R
    needs:[diabetes_algo_wp2_1]
    outputs:
      highly_sensitive:
        data: output/file4analysisWP2_1_COVID.feather
      moderately_sensitive:
        csv:output/wp2_1/checks/check_*.csv
        figs:output/wp2_1/checks/*.jpeg
        
  wp2_1_baseline_tables:
    run:r:v2 analysis/Baseline_WP2_1.R
    needs:[wp2_1_processing]
    outputs:
      moderately_sensitive:
        csv: output/wp2_1/tables/*.csv
        
  wp2_1_plots:
    run:r:v2 analysis/Rate_WP2_1.R
    needs:[wp2_1_processing]
    outputs:
      moderately senstitive:
        figs:output/wp2_1/figures/*.jpeg
       
      
    
 
